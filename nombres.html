<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombres y apellidos</title>
</head>
<body>
    <h1>Nombres y apellidos</h1>
    <form action="Inicio.HTML" method="get">
        <p><label for="nombres">Nombres completos</label><br>
        <input type="text" id="nombres" name="nombres" required></p>
        <p><label for="apellidos">Apellidos completos</label><br>
        <input type="text" id="apellidos" name="apellidos" required></p>
        <button type="submit">Enviar y volver al inicio</button>
    </form>
    <p><a href="Inicio.HTML">Volver al inicio sin enviar</a></p>
</body>
</html>
